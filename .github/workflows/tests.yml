name: Coordinate migration tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  migration:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node.js 24
        with:
          python-version: '3.12'
      - run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v
